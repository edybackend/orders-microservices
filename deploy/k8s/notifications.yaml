apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels: { app: notifications }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notifications }
  template:
    metadata:
      labels: { app: notifications }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: notifications
          image: orders-microservices/notifications:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - name: AMQP_URL
              valueFrom:
                secretKeyRef: { name: rabbitmq-connection, key: go }
            - { name: ALLOWED_ORIGIN, value: "http://localhost:8080" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
spec:
  selector: { app: notifications }
  ports:
    - { name: http, port: 8081, targetPort: http }
